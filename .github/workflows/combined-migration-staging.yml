name: Consolidated migration staging verification
on:
  push:
    branches: [work/combined-migration-staging-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build preserved Imperial Games frontend
        working-directory: original-app
        run: |
          npm ci --no-audit --no-fund
          npm run build
