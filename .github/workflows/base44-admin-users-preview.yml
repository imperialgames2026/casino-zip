name: Base44 Admin Users migration (staging, read-only)
on:
  push:
    branches: [feature/base44-admin-users-staging-20261019]
  pull_request:
    branches: [feature/base44-migration-player-surfaces-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check root project types
        run: npm run typecheck
      - name: Run migration and security regression tests
        run: npm run test
      - name: Compile integration frontend
        run: npm run build
      - name: Install preserved original frontend
        working-directory: original-app
        run: npm ci --no-audit --no-fund
      - name: Compile Supabase-migrated original frontend
        working-directory: original-app
        run: npm run build
      - name: Save isolated original-app preview (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: imperial-admin-users-source-preview
          path: original-app/dist/
          retention-days: 5
