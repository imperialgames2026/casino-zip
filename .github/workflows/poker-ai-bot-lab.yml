name: Poker AI Bot Lab
on:
  push:
    branches: [feature/poker-ai-lab-staging]
  pull_request:
    branches: [work/poker-frontend-route-20261018]
permissions:
  contents: read
jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install and build original casino frontend
        run: cd original-app && npm ci --no-audit --no-fund && npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check deployed staging bot function
        run: deno check supabase/functions/ig-poker-bot-lab/index.ts
