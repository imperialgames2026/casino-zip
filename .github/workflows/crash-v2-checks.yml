name: Crash V2 Integration Checks
on:
  push:
    branches:
      - feature/crash-trenball-v2
  pull_request:
    branches:
      - integration/app-scaffold-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
